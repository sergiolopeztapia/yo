server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    http {
        include       /etc/nginx/mime.types;  # <--- Esta línea es la clave
        default_type  application/octet-stream;
        
        server {
            # ... tu configuración del servidor ...
        }
    }
}