# 1. El bloque 'http' envuelve TODO
http {
    # Aquí cargamos los MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # TRUCO EXTRA: Forzamos que .mjs también sea detectado como JavaScript
    # por si la versión de Nginx es antigua y no lo trae en el archivo mime.types
    types {
        application/javascript js mjs;
    }

    # 2. El bloque 'server' va DENTRO del bloque 'http'
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 3. Los bloques 'location' van DENTRO del bloque 'server'
        location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}