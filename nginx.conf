server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cargamos primero los tipos por defecto de Nginx para no romper ningún formato
    include /etc/nginx/mime.types;

    # Forzamos explícitamente que .mjs sea reconocido como JavaScript moderno
    types {
        application/javascript mjs;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}